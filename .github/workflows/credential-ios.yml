name: Build patched iOS credential helper
on:
  push:
    branches: [pacemaker-observer-workaround]
    paths:
      - 'credential-retrieval/**'
      - '.github/workflows/credential-ios.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          git rev-parse HEAD
      - name: Install ldid
        run: brew install ldid
      - name: Build and sign full companion bundle
        run: make -C credential-retrieval bundle
      - name: Verify architecture, legacy loader metadata and entitlements
        shell: bash
        run: |
          set -euo pipefail
          for binary in credential-retrieval/build/bundle/*.ios; do
            test "$(lipo -archs "$binary")" = arm64
            xcrun otool -l "$binary" > /tmp/load-commands.txt
            grep -q LC_DYLD_INFO /tmp/load-commands.txt
            if grep -q LC_DYLD_CHAINED_FIXUPS /tmp/load-commands.txt; then
              echo "Unexpected chained fixups for legacy iOS"; exit 1
            fi
            ldid -e "$binary" > /tmp/embedded-entitlements.plist
            plutil -lint /tmp/embedded-entitlements.plist
          done
      - name: Package helpers, tables and matching host source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact/host artifact/entitlements
          cp credential-retrieval/build/bundle/* artifact/
          cp credential-retrieval/credential/credential.entitlements.plist artifact/entitlements/
          cp credential-retrieval/driver/driver.entitlements.plist artifact/entitlements/
          cp credential-retrieval/trigger/trigger.entitlements.plist artifact/entitlements/
          cp core.py decrypt.py requirements.txt artifact/host/
          git rev-parse HEAD > artifact/BUILD-COMMIT.txt
          xcodebuild -version > artifact/TOOLCHAIN.txt
          (cd artifact && shasum -a 256 *.ios *.bin > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: pacemaker-credential-ios
          path: artifact/
          if-no-files-found: error
          retention-days: 14
